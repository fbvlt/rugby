// BENCH / REMPLAÇANTS
// ════════════════════════════════════════════════

function renderBench() {
  const div = document.getElementById('benchContent');
  if (!div) return;
  const match = getCurrentMatch();

  if (!match) {
    div.innerHTML = `<div class="empty-state"><div class="icon">🔄</div><p>Sélectionnez un match actif<br>dans l'onglet Matchs.</p></div>`;
    return;
  }

  const positions = getPositions(match);
  const onFieldPlayers = new Set(positions.map(p => match.lineup[p.num]).filter(Boolean));

  // Bench list: available players NOT on field, sorted by tournament playtime ASCENDING
  const benchPlayers = state.players
    .filter(p => !onFieldPlayers.has(p.name) && isAvailable(p.name))
    .map(p => ({
      name: p.name,
      positions: p.positions,
      tTime: state.tournamentPlaytime[p.name] || 0,
      mTime: (match.playtime[p.name] || 0) + getLiveExtra(p.name),
    }))
    .sort((a, b) => a.tTime - b.tTime); // ascending: least played first

  let html = '';

  // Instruction banner
  if (benchSelectedPlayer) {
    html += `<div class="sub-instruction">
      ✅ <strong>${benchSelectedPlayer}</strong> sélectionné — touchez un poste pour effectuer le changement
    </div>
    <button class="sub-cancel-btn" onclick="cancelSubstitution()">✕ Annuler la sélection</button>`;
  } else {
    html += `<div class="sub-instruction" style="color:var(--muted);background:transparent;border-color:var(--border)">
      Touchez un remplaçant pour voir les postes disponibles
    </div>`;
  }

  if (!benchPlayers.length) {
    html += `<div class="empty-state" style="padding:24px"><div class="icon">👥</div><p>Tous les joueurs sont sur le terrain</p></div>`;
  } else {
    html += benchPlayers.map((p, i) => {
      const isSelected = benchSelectedPlayer === p.name;
      const rank = i + 1;
      // Highlight top 3 least-played (priority for entering)
      const isTop = rank <= 3;
      return `<div class="bench-player ${isSelected ? 'selected' : ''}" onclick="selectBenchPlayer('${escapeJs(p.name)}')">
        <div class="bench-rank ${isTop ? 'top' : ''}">${rank}</div>
        <div style="flex:1;min-width:0">
          <div class="bench-player-name">${p.name}</div>
          <div class="bench-player-meta">${p.positions.join(', ') || '—'}</div>
        </div>
        <div style="text-align:right">
          <div class="bench-time-val">${fmtTime(p.tTime)}</div>
          <div class="bench-time-label">tournoi</div>
          <div style="font-size:.65rem;color:var(--muted)">${fmtTime(p.mTime)} match</div>
        </div>
      </div>`;
    }).join('');
  }

  // If a player is selected, show field with all positions clickable
  if (benchSelectedPlayer) {
    const pd = state.players.find(p => p.name === benchSelectedPlayer);
    const compatTypes = pd ? pd.positions : [];

    html += `<div style="margin-top:12px">
      <div class="card-title" style="font-family:'Barlow Condensed',sans-serif;font-size:.8rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px">
        🏉 Tous les postes — taper pour substituer
      </div>`;

    const cats = {};
    positions.forEach(p => { if (!cats[p.cat]) cats[p.cat]=[]; cats[p.cat].push(p); });

    Object.entries(cats).forEach(([cat, pos]) => {
      html += `<div class="field-section"><div class="section-label">${cat}</div><div class="position-row">`;
      pos.forEach(p => {
        const player = match.lineup[p.num];
        const isCompat = compatTypes.includes(p.type);
        const changeTs = match.lastChangeTs[p.num];
        const sinceSecs = changeTs ? Math.round((Date.now() - changeTs) / 1000) : null;

        // Compatible: gold pulse. Incompatible: grey dashed, still clickable
        const slotClass = isCompat
          ? 'sub-target'
          : (player ? 'filled sub-incompat' : 'sub-incompat');

        html += `<div class="position-slot ${slotClass}" onclick="doSubstitution(${p.num})">
          <div class="pos-number">${p.num}</div>
          <div class="pos-name">${p.name}</div>
          ${player
            ? `<div class="pos-player" style="font-size:.78rem">${player}</div>`
            : `<div class="pos-empty">${isCompat ? 'Libre ✓' : 'Libre'}</div>`
          }
          ${sinceSecs !== null
            ? `<div class="sub-since-big" style="color:${isCompat ? 'var(--accent)' : 'var(--muted)'}">⏱ ${fmtTime(sinceSecs)}</div>`
            : (player ? `<div class="sub-since-big" style="color:var(--muted)">nouveau</div>` : '')
          }
        </div>`;
      });
      html += `</div></div>`;
    });
    html += `</div>`;
  }

  div.innerHTML = html;
}

function selectBenchPlayer(name) {
  if (benchSelectedPlayer === name) {
    benchSelectedPlayer = null;
  } else {
    benchSelectedPlayer = name;
  }
  renderBench();
}

function cancelSubstitution() {
  benchSelectedPlayer = null;
  renderBench();
}

function doSubstitution(posNum) {
  const match = getCurrentMatch();
  if (!match || !benchSelectedPlayer) return;

  const outgoingPlayer = match.lineup[posNum];
  const posType = getPositions(match).find(p=>p.num===posNum)?.type;

  // Flush outgoing player's time with position tracking
  if (outgoingPlayer) onPlayerRemoved(outgoingPlayer, posType);

  // Record entry
  match.entries[benchSelectedPlayer] = (match.entries[benchSelectedPlayer] || 0) + 1;
  state.tournamentEntries[benchSelectedPlayer] = (state.tournamentEntries[benchSelectedPlayer] || 0) + 1;

  match.lineup[posNum] = benchSelectedPlayer;
  match.lastChangeTs[posNum] = Date.now();
  onPlayerPlaced(benchSelectedPlayer);

  save();
  benchSelectedPlayer = null;
  renderBench();
  renderCompo();
}


// ════════════════════════════════════════════════
// SWAP MODE
// ════════════════════════════════════════════════
function setSwapFirst(posNum) {
  swapFirstPos = posNum;
  renderCompo();
}

function toggleSwapMode() {
  swapMode = !swapMode;
  swapFirstPos = null;
  renderCompo();
}

function doSwap(posNum) {
  const match = getCurrentMatch(); if (!match) return;
  if (swapFirstPos === null) return;
  if (swapFirstPos === posNum) { swapFirstPos = null; renderCompo(); return; }

  const p1 = match.lineup[swapFirstPos];
  const p2 = match.lineup[posNum];

  // Flush playtimes before swap with correct posType
  const pos1Type = getPositions(match).find(p=>p.num===swapFirstPos)?.type;
  const pos2Type = getPositions(match).find(p=>p.num===posNum)?.type;
  if (p1) onPlayerRemoved(p1, pos1Type);
  if (p2) onPlayerRemoved(p2, pos2Type);

  // Swap
  match.lineup[swapFirstPos] = p2;
  match.lineup[posNum] = p1;
  match.lastChangeTs[swapFirstPos] = Date.now();
  match.lastChangeTs[posNum] = Date.now();

  // Restart time tracking
  if (p2) onPlayerPlaced(p2);
  if (p1) onPlayerPlaced(p1);

  swapFirstPos = null;
  save(); renderCompo(); renderBench();
}

// openPicker in swap mode: select first slot
function openPickerOrSwap(posNum) {
  if (swapFirstPos !== null) { doSwap(posNum); return; }
  openPicker(posNum);
}

// ════════════════════════════════════════════════
// AUTO FILL LINEUP
// ════════════════════════════════════════════════
function autoFillLineup() {
  const match = getCurrentMatch(); if (!match) return;
  const positions = getPositions(match);
  const available = state.players.filter(p => isAvailable(p.name));

  // Sort available players by tournament playtime ascending (less played = higher priority)
  const sorted = [...available].sort((a,b)=>
    (state.tournamentPlaytime[a.name]||0) - (state.tournamentPlaytime[b.name]||0)
  );

  const newLineup = {};
  positions.forEach(p => newLineup[p.num] = null);
  const assigned = new Set();

  // First pass: assign players to their natural positions (least played first)
  positions.forEach(pos => {
    const candidate = sorted.find(p => !assigned.has(p.name) && p.positions.includes(pos.type));
    if (candidate) {
      newLineup[pos.num] = candidate.name;
      assigned.add(candidate.name);
    }
  });

  // Second pass: fill remaining empty positions with any unassigned player
  // Sort by: least time played at THIS specific position first (deputising awareness),
  // then fallback to least total tournament playtime
  positions.forEach(pos => {
    if (!newLineup[pos.num]) {
      const unassigned = sorted.filter(p => !assigned.has(p.name));
      if (!unassigned.length) return;
      // Sort by playtime at this posType ascending, then total playtime ascending
      unassigned.sort((a, b) => {
        const aPosTime = ((state.positionPlaytime||{})[a.name]||{})[pos.type] || 0;
        const bPosTime = ((state.positionPlaytime||{})[b.name]||{})[pos.type] || 0;
        if (aPosTime !== bPosTime) return aPosTime - bPosTime; // less time at this pos = priority
        return (state.tournamentPlaytime[a.name]||0) - (state.tournamentPlaytime[b.name]||0);
      });
      const candidate = unassigned[0];
      newLineup[pos.num] = candidate.name;
      assigned.add(candidate.name);
    }
  });

  const filledCount = Object.values(newLineup).filter(Boolean).length;
  if (!confirm(`Remplir automatiquement ${filledCount}/${positions.length} postes selon les temps de jeu ?\nLes postes déjà remplis seront remplacés.`)) return;

  // Flush all current players
  positions.forEach(pos => {
    const p = match.lineup[pos.num];
    if (p) onPlayerRemoved(p, pos.type);
  });

  match.lineup = newLineup;
  match.lastChangeTs = {};
  positions.forEach(p => { if (newLineup[p.num]) match.lastChangeTs[p.num] = Date.now(); });

  // Start tracking new players
  positions.forEach(pos => { if (newLineup[pos.num]) onPlayerPlaced(newLineup[pos.num]); });

  save(); renderCompo(); renderBench();
}


// ════════════════════════════════════════════════
// HALFTIME AUTO COMPOSITION
// ════════════════════════════════════════════════
function autoFillHalfTime() {
  const match = getCurrentMatch(); if (!match) return;
  const positions = getPositions(match);
  const available = state.players.filter(p => isAvailable(p.name));

  // Players to KEEP: currently on field AND have been there <= 60s
  const keepPlayers = new Set();
  positions.forEach(pos => {
    const p = match.lineup[pos.num]; if (!p) return;
    const liveTime = getLiveExtra(p);
    const savedTime = match.playtime[p] || 0;
    // Keep if their time in current stint is ≤60s (just entered)
    if (liveTime <= 60 && savedTime <= 60) keepPlayers.add(p);
  });

  // Sort available players by tournament playtime ascending
  const sorted = [...available].sort((a,b)=>
    (state.tournamentPlaytime[a.name]||0) - (state.tournamentPlaytime[b.name]||0)
  );

  const newLineup = {};
  positions.forEach(p => newLineup[p.num] = null);
  const assigned = new Set();

  // Lock kept players to their current positions
  positions.forEach(pos => {
    const p = match.lineup[pos.num];
    if (p && keepPlayers.has(p)) {
      newLineup[pos.num] = p;
      assigned.add(p);
    }
  });

  // First pass: fill remaining with players at their natural position (least played)
  positions.forEach(pos => {
    if (newLineup[pos.num]) return;
    const candidate = sorted.find(p => !assigned.has(p.name) && p.positions.includes(pos.type));
    if (candidate) { newLineup[pos.num]=candidate.name; assigned.add(candidate.name); }
  });

  // Second pass: fill remaining with any player, sorted by pos-specific time then total
  positions.forEach(pos => {
    if (newLineup[pos.num]) return;
    const unassigned = sorted.filter(p => !assigned.has(p.name));
    if (!unassigned.length) return;
    unassigned.sort((a,b) => {
      const aPT = ((state.positionPlaytime||{})[a.name]||{})[pos.type]||0;
      const bPT = ((state.positionPlaytime||{})[b.name]||{})[pos.type]||0;
      if (aPT!==bPT) return aPT-bPT;
      return (state.tournamentPlaytime[a.name]||0)-(state.tournamentPlaytime[b.name]||0);
    });
    newLineup[pos.num]=unassigned[0].name; assigned.add(unassigned[0].name);
  });

  const keptList = [...keepPlayers].join(', ') || 'aucun';
  const filledCount = Object.values(newLineup).filter(Boolean).length;
  if (!confirm(`Compo 2ème mi-temps :
• ${keepPlayers.size} joueur(s) conservé(s) (≤1 min en jeu) : ${keptList}
• ${filledCount} postes remplis au total

Appliquer ?`)) return;

  // Flush all players not being kept
  positions.forEach(pos => {
    const p = match.lineup[pos.num];
    if (p && !keepPlayers.has(p)) onPlayerRemoved(p, pos.type);
  });

  match.lineup = newLineup;
  match.lastChangeTs = {};
  positions.forEach(pos => {
    if (newLineup[pos.num] && !keepPlayers.has(newLineup[pos.num]))
      match.lastChangeTs[pos.num] = Date.now();
  });

  positions.forEach(pos => {
    const p = newLineup[pos.num]; if (!p) return;
    if (!keepPlayers.has(p)) onPlayerPlaced(p);
  });

  save(); renderCompo(); renderBench();
}

// ════════════════════════════════════════════════
// SUB SUGGESTION ENGINE
// ════════════════════════════════════════════════
function showSubSuggestion() {
  const match = getCurrentMatch(); if (!match) return;
  const positions = getPositions(match);
  const available = state.players.filter(p => isAvailable(p.name));
  const onFieldPlayers = new Set(positions.map(p=>match.lineup[p.num]).filter(Boolean));
  const benchPlayers = available.filter(p => !onFieldPlayers.has(p.name))
    .sort((a,b) => (state.tournamentPlaytime[a.name]||0)-(state.tournamentPlaytime[b.name]||0));

  // We want to suggest changes for half the bench (rounded up), min 1
  const nSugg = Math.max(1, Math.ceil(benchPlayers.length / 2));
  const incoming = benchPlayers.slice(0, nSugg); // least played on bench

  // For each incoming player, find best outgoing player (most played on field, at compat pos)
  const suggestions = [];
  const usedOutgoing = new Set();
  const positionsCopy = [...positions];

  incoming.forEach(benchPlayer => {
    const compatTypes = benchPlayer.positions;
    // Try natural positions first
    let bestPos = null, bestOut = null, bestOutTime = -1;

    // Among field positions compatible with this bench player
    positionsCopy.forEach(pos => {
      const onFieldPlayer = match.lineup[pos.num];
      if (!onFieldPlayer || usedOutgoing.has(onFieldPlayer)) return;
      const isNatural = compatTypes.includes(pos.type);
      if (!isNatural) return;
      const t = (state.tournamentPlaytime[onFieldPlayer]||0) + getLiveExtra(onFieldPlayer);
      if (t > bestOutTime) { bestOutTime=t; bestOut=onFieldPlayer; bestPos=pos; }
    });

    // If no natural match found, try any position
    if (!bestPos) {
      positionsCopy.forEach(pos => {
        const onFieldPlayer = match.lineup[pos.num];
        if (!onFieldPlayer || usedOutgoing.has(onFieldPlayer)) return;
        const t = (state.tournamentPlaytime[onFieldPlayer]||0) + getLiveExtra(onFieldPlayer);
        if (t > bestOutTime) { bestOutTime=t; bestOut=onFieldPlayer; bestPos=pos; }
      });
    }

    if (bestPos && bestOut) {
      const isNatural = benchPlayer.positions.includes(bestPos.type);
      suggestions.push({ in: benchPlayer.name, out: bestOut, pos: bestPos, natural: isNatural });
      usedOutgoing.add(bestOut);
    }
  });

  if (!suggestions.length) return;

  // Show in the sub suggestion box inside timer block
  const box = document.getElementById('subSuggestionBox');
  if (!box) return;

  // Build rows HTML
  const defaultNext = state.subIntervalMin || 5;
  let rowsHtml = '';
  suggestions.forEach((s, i) => {
    const natural = s.natural ? '' : ' <span style="color:var(--accent);font-size:.62rem">(dépannage)</span>';
    rowsHtml += '<div class="suggestion-row" id="sugg_row_' + i + '">'
      + '<div style="flex:1">'
      + '<div><span class="sugg-out">↓ ' + s.out + '</span><span class="sugg-arrow">→</span><span class="sugg-in">↑ ' + s.in + '</span></div>'
      + '<div class="sugg-pos">#' + s.pos.num + ' ' + s.pos.name + natural + '</div>'
      + '</div>'
      + '<button id="sugg_btn_' + i + '" onclick="applySubSuggestion(' + JSON.stringify(s.in) + ',' + JSON.stringify(s.out) + ',' + s.pos.num + ',' + i + ')" '
      + 'style="background:var(--blue);border:none;color:white;border-radius:8px;padding:6px 10px;font-family:\'Barlow Condensed\',sans-serif;font-weight:700;font-size:.78rem;cursor:pointer;flex-shrink:0">'
      + '✓ Valider</button>'
      + '</div>';
  });

  box.innerHTML = '<div class="sub-suggestion" style="margin-top:12px">'
    + '<div style="font-family:\'Barlow Condensed\',sans-serif;font-weight:700;font-size:.82rem;letter-spacing:1px;text-transform:uppercase;color:var(--blue);margin-bottom:8px">💡 Propositions de changements</div>'
    + '<div id="sugg_rows">' + rowsHtml + '</div>'
    + '<div style="margin-top:12px;border-top:1px solid var(--border);padding-top:10px">'
    + '<div style="font-size:.75rem;color:var(--muted);margin-bottom:6px">Prochaine proposition dans (min) :</div>'
    + '<div style="display:flex;gap:8px;align-items:center">'
    + '<input type="number" id="nextSubInput" value="' + defaultNext + '" min="0" max="99" '
    + 'style="width:58px;margin:0;padding:6px;text-align:center;font-size:.9rem;background:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--text)">'
    + '<button onclick="closeSubSuggestion()" style="flex:1;background:var(--accent);border:none;color:#0a1628;border-radius:8px;padding:8px;font-family:\'Barlow Condensed\',sans-serif;font-weight:700;font-size:.8rem;cursor:pointer">✕ Fermer</button>'
    + '</div></div></div>';
}

function applySubSuggestion(inPlayer, outPlayer, posNum, rowIdx) {
  const match = getCurrentMatch(); if (!match) return;
  const posType = getPositions(match).find(p=>p.num===posNum)?.type;

  // Save the panel HTML before any re-render wipes it
  const box = document.getElementById('subSuggestionBox');
  if (box) _savedSuggHTML = box.innerHTML;

  onPlayerRemoved(outPlayer, posType);
  match.entries[inPlayer]=(match.entries[inPlayer]||0)+1;
  state.tournamentEntries[inPlayer]=(state.tournamentEntries[inPlayer]||0)+1;
  match.lineup[posNum]=inPlayer;
  match.lastChangeTs[posNum]=Date.now();
  onPlayerPlaced(inPlayer);
  save(); renderCompo(); renderBench();
  // _savedSuggHTML was restored by renderTimerSection — now update this row's state
  const btn = document.getElementById('sugg_btn_'+rowIdx);
  const row = document.getElementById('sugg_row_'+rowIdx);
  if (btn) { btn.textContent='✅ Fait'; btn.disabled=true; btn.style.background='var(--green)'; }
  if (row) row.style.opacity='0.5';
}

function dismissSubSuggestion() {
  const box = document.getElementById('subSuggestionBox');
  if (box) box.innerHTML='';
}

function closeSubSuggestion() {
  // Read the next interval from the panel input
  const input = document.getElementById('nextSubInput');
  if (input) {
    const val = parseInt(input.value);
    if (!isNaN(val) && val > 0) {
      // Only schedule if val minutes < time remaining in current half
      const remainingMin = Math.max(0, timer.secondsLeft) / 60;
      if (val < remainingMin) {
        state.subIntervalMin = val;
        const si = document.getElementById('subIntervalInput');
        if (si) si.value = val;
        save();
        scheduleSubSuggestion();
      }
      // If val >= remaining time: don't schedule (ignore silently)
    }
    // val === 0: don't reschedule
  }
  dismissSubSuggestion();
}

function rescheduleSubSuggestion() {
  dismissSubSuggestion();
  scheduleSubSuggestion();
}

function importData(event) {
  const file=event.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    try { Object.assign(state,JSON.parse(e.target.result)); save(); load(); alert('✅ Importé !'); }
    catch(err) { alert('❌ Fichier JSON invalide'); }
  };
  reader.readAsText(file);
}

function fmtTime(s) {
  if (!s||s<=0) return '0:00';
  return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}
function escapeJs(s) { return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
